<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แผนที่จุดลงเวลา - Check-in Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; background: #f4f7f6; }
        .header { background: #007bff; color: white; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header h2 { margin: 0; font-size: 18px; }
        
        #map { width: 100%; height: calc(100vh - 60px); /* หักลบความสูง Header */ }
        
        /* สไตล์ Popup ในแผนที่ */
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 10px; padding: 5px; }
        .popup-info { font-family: 'Sarabun', sans-serif; line-height: 1.4; }
        .status-in { color: #28a745; font-weight: bold; }
        .status-out { color: #dc3545; font-weight: bold; }

        /* ปุ่มย้อนกลับ */
        .back-btn { position: fixed; bottom: 20px; left: 20px; z-index: 1000; background: white; padding: 10px 20px; border-radius: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); text-decoration: none; color: #333; font-weight: bold; font-size: 14px; border: 1px solid #ddd; }
        
        /* Loader */
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 2000; }
    </style>
</head>
<body>

<div id="loader">📍 กำลังโหลดพิกัดบนแผนที่...</div>

<div class="header">
    <h2>แผนที่จุดเช็คอินทั้งหมด</h2>
</div>

<a href="index.html" class="back-btn">⬅️ ย้อนกลับ</a>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // ⚙️ ตั้งค่า (ใช้ตัวเดียวกับไฟล์หลัก)
    const API_URL = "https://script.google.com/macros/s/AKfycbzmWupyTuisestNMQXYY19GrwdDn_GOvuWiCP5-YQiozQIyVksARdf1Zj4U8ofM7EIv0Q/exec";
    const OFFICE_LAT = 16.8071155; 
    const OFFICE_LNG = 100.2636339;

    let map;
    let registeredName = ""; // จะดึงจาก LocalStorage หรือดึงจาก LIFF ก็ได้

    // 1. เริ่มต้นสร้างแผนที่
    function initMap() {
        map = L.map('map').setView([OFFICE_LAT, OFFICE_LNG], 14); // ซูมไปที่ออฟฟิศก่อน

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // ปักหมุดตำแหน่งออฟฟิศ (หมุดสีน้ำเงินปกติ)
        L.marker([OFFICE_LAT, OFFICE_LNG]).addTo(map)
            .bindPopup("<b>📍 ตำแหน่งออฟฟิศ</b>").openPopup();
            
        loadCheckInData();
    }

    // 2. ดึงข้อมูลพิกัดจาก Google Sheets (ผ่าน Apps Script ตัวเดิม)
    async function loadCheckInData() {
        // ดึงชื่อจากหน้าหลัก (ถ้าเก็บไว้ใน localStorage)
        registeredName = localStorage.getItem('userName') || "พนักงาน"; 

        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'history', name: registeredName })
            });
            const data = await resp.json();
            
            if (data && data.length > 0) {
                data.forEach(item => {
                    if (item.location) {
                        // ดึง Lat, Lng ออกจาก Link Google Maps (http://.../1{lat},{lng})
                        // หมายเหตุ: โค้ดเดิมคุณส่งเป็น link เราต้องดึงตัวเลขออกมา
                        const coordsMatch = item.location.match(/1\{?(-?\ shadow\d+\.\d+),(-?\d+\.\d+)\}?/);
                        
                        if (coordsMatch) {
                            const lat = parseFloat(coordsMatch[1]);
                            const lng = parseFloat(coordsMatch[2]);
                            const isCheckIn = item.status === "เข้างาน";
                            
                            // สร้างหมุดตามสถานะ
                            const markerColor = isCheckIn ? "#28a745" : "#dc3545";
                            const circle = L.circleMarker([lat, lng], {
                                radius: 8,
                                fillColor: markerColor,
                                color: "#fff",
                                weight: 2,
                                opacity: 1,
                                fillOpacity: 0.8
                            }).addTo(map);

                            // ใส่รายละเอียดเมื่อคลิกหมุด
                            circle.bindPopup(`
                                <div class="popup-info">
                                    <b class="${isCheckIn ? 'status-in' : 'status-out'}">${item.status}</b><br>
                                    📅 ${item.date}<br>
                                    🕒 เวลา: ${isCheckIn ? item.timeIn : item.timeOut}<br>
                                </div>
                            `, { className: 'custom-popup' });
                        }
                    }
                });
            }
            document.getElementById('loader').style.display = 'none';
        } catch (e) {
            console.error(e);
            alert("ไม่สามารถดึงข้อมูลพิกัดได้");
            document.getElementById('loader').style.display = 'none';
        }
    }

    // รันแผนที่
    initMap();

</script>
</body>
</html>
