<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; padding: 0; 
            background: #f4f7f6; 
            display: flex; justify-content: center;
            color: #333;
        }
        .app-container {
            width: 100%; max-width: 480px; 
            min-height: 100vh; background: #fff;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative; overflow-x: hidden;
        }
        .header { background: #00B900; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .header h2 { margin: 0; font-weight: 500; font-size: 22px; }
        .content { padding: 20px; text-align: center; }
        
        /* ส่วนของนาฬิกา */
        .time-box { margin-bottom: 20px; }
        .clock { font-size: 40px; font-weight: 700; color: #00B900; line-height: 1; margin-bottom: 5px; }
        .date { font-size: 16px; color: #666; }

        /* วิดีโอสแกน */
        .video-container { 
            width: 100%; height: 300px; 
            background: #000; border-radius: 15px; 
            overflow: hidden; position: relative;
            margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* ปุ่มกด */
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { 
            flex: 1; padding: 15px; border: none; border-radius: 10px; 
            font-size: 18px; font-weight: 500; color: white; font-family: 'Sarabun', sans-serif;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-in { background: #28a745; }
        .btn-out { background: #dc3545; }
        .btn-history { background: #6c757d; width: 100%; padding: 12px; margin-top: 10px; }
        .btn-reg { background: #007bff; width: 100%; margin-top: 20px; }

        input[type="text"] {
            width: 100%; padding: 15px; border: 1px solid #ddd; 
            border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 16px;
            box-sizing: border-box; text-align: center;
        }

        /* หน้าต่าง Loader */
        .loader-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 1000; display: none;
        }
        .progress-box { width: 80%; max-width: 300px; background: #e9ecef; border-radius: 10px; overflow: hidden; margin-top: 20px; height: 15px; }
        .progress-bar { width: 0%; height: 100%; background: #00B900; transition: width 0.4s ease; }
        .loader-text { margin-top: 15px; font-size: 18px; font-weight: 500; color: #333; }
        .spinner { font-size: 50px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }

        /* หน้าต่างประวัติ */
        .history-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 500; display: none; overflow-y: auto;
            padding-bottom: 30px;
        }
        .history-item { 
            background: #f8f9fa; margin: 10px 20px; padding: 15px; 
            border-radius: 10px; border-left: 5px solid #00B900; text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-close { background: #dc3545; color: white; border: none; padding: 10px 20px; border-radius: 5px; margin: 20px; font-family: 'Sarabun', sans-serif; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
<canvas id="canvas" style="display:none;"></canvas>

<div class="app-container">
    
    <div class="loader-overlay" id="loader">
        <div class="spinner">📍</div>
        <div class="loader-text" id="loader-text">กำลังเตรียมพร้อม...</div>
        <div class="progress-box"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div id="reg-form" class="content hidden">
        <h2 style="color: #007bff;">ลงทะเบียนใช้งานครั้งแรก</h2>
        <p style="color: #666;">กรุณาระบุชื่อ-นามสกุล ของคุณเพื่อผูกกับระบบ</p>
        <input type="text" id="regName" placeholder="ระบุ ชื่อ-นามสกุล">
        <button class="btn btn-reg" onclick="register()">ลงทะเบียน</button>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <h2>ระบบบันทึกเวลาทำงาน</h2>
            <div id="welcomeMsg" style="font-size: 14px; margin-top: 5px; opacity: 0.9;">สวัสดีคุณ...</div>
        </div>
        
        <div class="content">
            <div class="time-box">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="date">วัน เดือน ปี</div>
            </div>

            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>

            <div class="btn-group">
                <button class="btn btn-in" onclick="processAttendance('in')">สแกนเข้างาน</button>
                <button class="btn btn-out" onclick="processAttendance('out')">สแกนออกงาน</button>
            </div>
            <button class="btn btn-history" onclick="fetchHistory()">ดูประวัติการลงเวลา</button>
        </div>
    </div>

    <div class="history-modal" id="history-modal">
        <div class="header" style="background: #6c757d; border-radius: 0;">
            <h2>ประวัติย้อนหลัง (10 รายการล่าสุด)</h2>
        </div>
        <div id="history-list"></div>
        <div style="text-align: center;">
            <button class="btn-close" onclick="document.getElementById('history-modal').style.display='none'">ปิดหน้าต่าง</button>
        </div>
    </div>

</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwQJloOuaXh_DpNqWQ-YTO13v_qkDR2URmYuDpbx0Gvuu2Zwj-K73o19nclk6RDtMRDsw/exec"; 
    const LIFF_ID = "2009502922-k1zdFCRh"; 

    let userProfile = {};
    let registeredName = "";

    // อัปเดตนาฬิกา
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('th-TH', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // เริ่มการทำงานของ LIFF
    async function initLiff() {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
            liff.login();
        } else {
            userProfile = await liff.getProfile();
            checkRegistration();
        }
    }

    async function checkRegistration() {
        showLoader("กำลังตรวจสอบข้อมูล...", 50);
        try {
            const resp = await fetch(`${API_URL}?userId=${userProfile.userId}`);
            const result = await resp.text();
            
            hideLoader();
            if (result === "not_found") {
                document.getElementById('reg-form').classList.remove('hidden');
            } else {
                registeredName = result;
                document.getElementById('welcomeMsg').innerText = "พนักงาน: " + registeredName;
                document.getElementById('main-app').classList.remove('hidden');
                startVideo();
            }
        } catch(e) {
            alert("เชื่อมต่อฐานข้อมูลล้มเหลว");
            hideLoader();
        }
    }

    function startVideo() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { document.getElementById('video').srcObject = stream; })
            .catch(err => alert("กรุณาอนุญาตการเข้าถึงกล้องถ่ายรูป"));
    }

    // ฟังก์ชันจัดการ UI แถบโหลด
    function showLoader(text, percent, icon="⏳") {
        document.getElementById('loader').style.display = 'flex';
        document.querySelector('.spinner').innerText = icon;
        document.getElementById('loader-text').innerText = text;
        document.getElementById('progress-bar').style.width = percent + '%';
    }
    function hideLoader() {
        document.getElementById('loader').style.display = 'none';
    }
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // ขอพิกัด GPS (แก้ลิงก์แผนที่ให้ถูกต้องแล้ว)
    function getLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve("ไม่รองรับ GPS");
            } else {
                navigator.geolocation.getCurrentPosition(
                    (position) => { 
                        // แก้ไขเครื่องหมายตรงนี้แล้วครับ
                        resolve(`https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`); 
                    },
                    (error) => { resolve("ปิดการเข้าถึง GPS"); },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        });
    }

 // สแกนใบหน้า ถ่ายรูป และบันทึก
    async function processAttendance(type) {
        let typeText = type === 'in' ? 'เข้างาน' : 'ออกงาน';
        document.getElementById('progress-bar').style.background = "#00B900"; 
        
        showLoader("กำลังถ่ายภาพ...", 20, "📸");

        // --- ส่วนที่เพิ่มเข้ามา: แคปรูปจากวิดีโอ ---
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        // แปลงภาพเป็น Base64
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6); 
        // --------------------------------------

        await sleep(500); 

        showLoader("กำลังดึงพิกัดตำแหน่ง (GPS)...", 40, "📍");
        const locationStr = await getLocation();

        showLoader("กำลังอัปโหลดรูปภาพและบันทึก...", 70, "☁️");

        try {
            await fetch(API_URL, {
                method: 'POST',
                // *** เพิ่มตัวแปร image ส่งไปด้วย ***
                body: JSON.stringify({ action: 'attendance', name: registeredName, type: type, location: locationStr, image: imageDataUrl })
            });

            showLoader(`บันทึกเวลา${typeText} สำเร็จ!`, 100, "✅");
            await sleep(1500);
            hideLoader(); 

        } catch (err) {
            showLoader("เกิดข้อผิดพลาดในการบันทึก!", 100, "❌");
            document.getElementById('progress-bar').style.background = "red";
            await sleep(2000);
            hideLoader();
        }
    }

    // ลงทะเบียน
    async function register() {
        const name = document.getElementById('regName').value;
        if(!name) return alert("กรุณากรอกชื่อ-นามสกุล");
        
        showLoader("กำลังบันทึกข้อมูล...", 50, "📝");
        try {
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'register', userId: userProfile.userId, name: name })
            });
            showLoader("ลงทะเบียนสำเร็จ!", 100, "🎉");
            await sleep(1000);
            location.reload();
        } catch (err) {
            alert("ลงทะเบียนไม่สำเร็จ");
            hideLoader();
        }
    }

    // ดึงประวัติ
    async function fetchHistory() {
        showLoader("กำลังดึงข้อมูลประวัติ...", 60, "📅");
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'history', name: registeredName })
            });
            const data = await resp.json();
            
            const listDiv = document.getElementById('history-list');
            listDiv.innerHTML = '';
            
            if(data.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; margin-top:20px;">ไม่มีประวัติการลงเวลา</p>';
            } else {
                data.forEach(item => {
                    listDiv.innerHTML += `
                        <div class="history-item">
                            <strong>วันที่:</strong> ${item.date} <br>
                            <strong style="color:#28a745;">เวลาเข้า:</strong> ${item.timeIn} <br>
                            <strong style="color:#dc3545;">เวลาออก:</strong> ${item.timeOut} <br>
                            <span style="font-size:12px; color:#666;">สถานะ: ${item.status}</span>
                        </div>
                    `;
                });
            }
            hideLoader();
            document.getElementById('history-modal').style.display = 'block';
        } catch(e) {
            alert("ดึงประวัติไม่สำเร็จ");
            hideLoader();
        }
    }

    // เริ่มทำงาน
    initLiff();

</script>
</body>
</html>
