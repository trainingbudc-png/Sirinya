<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        /* --- โซนที่ 1: ตกแต่งหน้าตา (CSS) --- */
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; background: #f4f7f6; display: flex; justify-content: center; color: #333; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; overflow-x: hidden; padding-bottom: 20px;}
        .header { background: #00B900; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .header h2 { margin: 0; font-weight: 500; font-size: 22px; }
        .content { padding: 20px; text-align: center; }
        .time-box { margin-bottom: 20px; }
        .clock { font-size: 40px; font-weight: 700; color: #00B900; line-height: 1; margin-bottom: 5px; }
        .date { font-size: 16px; color: #666; }
        .video-container { width: 100%; height: 250px; background: #000; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: 500; color: white; font-family: 'Sarabun', sans-serif; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-in { background: #28a745; }
        .btn-out { background: #dc3545; }

        /* สไตล์ประวัติแบบยืด-หดได้ (Accordion) */
        .history-section { text-align: left; padding: 0 20px; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .history-item { background: #f8f9fa; margin-bottom: 8px; border-radius: 10px; border-left: 5px solid #00B900; overflow: hidden; transition: 0.3s; }
        .history-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: bold; font-size: 14px; }
        .history-header::after { content: '▼'; font-size: 10px; color: #999; transition: 0.3s; }
        .history-item.active .history-header::after { transform: rotate(180deg); }
        .history-body { max-height: 0; padding: 0 15px; background: #fff; overflow: hidden; transition: max-height 0.3s ease-out; font-size: 14px; }
        .history-item.active .history-body { max-height: 120px; padding: 10px 15px; border-top: 1px solid #eee; }

        /* Loader */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .progress-box { width: 80%; background: #e9ecef; border-radius: 10px; margin-top: 20px; height: 10px; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: #00B900; transition: 0.4s; }
        .hidden { display: none !important; }
        input[type="text"] { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 10px; text-align: center; box-sizing: border-box;}
    </style>
</head>
<body>
<canvas id="canvas" style="display:none;"></canvas>
<div class="app-container">
    <div class="loader-overlay" id="loader">
        <div id="loader-icon" style="font-size:50px;">⏳</div>
        <div id="loader-text" style="margin-top:10px;">กำลังโหลด...</div>
        <div class="progress-box"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div id="reg-form" class="content hidden">
        <h2 style="color: #007bff;">ลงทะเบียน</h2>
        <input type="text" id="regName" placeholder="ระบุ ชื่อ-นามสกุล">
        <button class="btn" style="background:#007bff; width:100%;" onclick="register()">ลงทะเบียน</button>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <h2 id="welcomeMsg">ระบบบันทึกเวลา</h2>
        </div>
        <div class="content">
            <div class="time-box">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="date">...</div>
            </div>
            <div class="video-container"><video id="video" autoplay muted playsinline></video></div>
            <div class="btn-group">
                <button class="btn btn-in" onclick="processAttendance('in')">เข้างาน</button>
                <button class="btn btn-out" onclick="processAttendance('out')">ออกงาน</button>
            </div>
        </div>
        <div class="history-section">
            <h3 style="margin:0 0 10px 0; font-size:18px;">ประวัติการลงเวลาล่าสุด</h3>
            <div id="history-list-main"></div>
        </div>
    </div>
</div>

<script>
    /* --- โซนที่ 2: การทำงาน (JavaScript) --- */
    const API_URL = "https://script.google.com/macros/s/AKfycbzmWupyTuisestNMQXYY19GrwdDn_GOvuWiCP5-YQiozQIyVksARdf1Zj4U8ofM7EIv0Q/exec"; 
    const LIFF_ID = "2009502922-k1zdFCRh"; 
    const OFFICE_LAT = 16.8071155; 
    const OFFICE_LNG = 100.2636339; 
    const ALLOWED_RADIUS = 1000; 

    let userProfile = {};
    let registeredName = "";

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        document.getElementById('date').innerText = now.toLocaleDateString('th-TH', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }
    setInterval(updateClock, 1000);

    function showLoader(text, percent, icon="⏳") {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('loader-text').innerText = text;
        document.getElementById('loader-icon').innerText = icon;
        document.getElementById('progress-bar').style.width = percent + '%';
    }

    function hideLoader() { document.getElementById('loader').style.display = 'none'; }

    async function initLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) { liff.login(); } 
            else {
                userProfile = await liff.getProfile();
                checkRegistration();
            }
        } catch (e) { console.error(e); }
    }

    async function checkRegistration() {
        showLoader("กำลังตรวจสอบ...", 50);
        try {
            const resp = await fetch(`${API_URL}?userId=${userProfile.userId}`, { method: 'GET', redirect: 'follow' });
            const result = await resp.json();
            hideLoader();
            if (result.isRegistered) {
                registeredName = result.name;
                document.getElementById('welcomeMsg').innerText = "พนักงาน: " + registeredName;
                document.getElementById('main-app').classList.remove('hidden');
                startVideo();
                fetchHistory(); // ดึงประวัติมาโชว์ทันที
            } else {
                document.getElementById('reg-form').classList.remove('hidden');
            }
        } catch(e) { hideLoader(); document.getElementById('reg-form').classList.remove('hidden'); }
    }

    function startVideo() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { document.getElementById('video').srcObject = stream; })
            .catch(err => alert("กรุณาเปิดกล้อง"));
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function processAttendance(type) {
        showLoader("ตรวจสอบพิกัด...", 20, "📍");
        navigator.geolocation.getCurrentPosition(async (pos) => {
            const dist = calculateDistance(pos.coords.latitude, pos.coords.longitude, OFFICE_LAT, OFFICE_LNG);
            if (dist > ALLOWED_RADIUS) {
                alert(`อยู่นอกพื้นที่! (ห่าง ${Math.round(dist)} ม.)`);
                hideLoader();
                return;
            }

            showLoader("ถ่ายภาพ...", 50, "📸");
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const img = canvas.toDataURL('image/jpeg', 0.5);

            showLoader("บันทึกข้อมูล...", 80, "☁️");
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'attendance', name: registeredName, type: type, location: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`, image: img })
                });
                const resText = await response.text();
                if(resText.includes("Success")) {
                    showLoader("บันทึกสำเร็จ!", 100, "✅");
                    setTimeout(() => { hideLoader(); fetchHistory(); }, 2000);
                }
            } catch (e) { alert("ล้มเหลว"); hideLoader(); }
        }, () => { alert("กรุณาเปิด GPS"); hideLoader(); }, { enableHighAccuracy: true });
    }

    async function fetchHistory() {
        const listDiv = document.getElementById('history-list-main');
        listDiv.innerHTML = '<p style="text-align:center; color:#999; font-size:12px;">กำลังอัปเดตประวัติล่าสุด...</p>';
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'history', name: registeredName })
            });
            const data = await resp.json();
            let html = '';
            
            if(!data || data.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; color:#999; font-size:14px;">ยังไม่มีประวัติการลงเวลา</p>';
                return;
            }

            data.forEach((h, index) => {
                let statusColor = h.status === "เข้างาน" ? "#28a745" : "#dc3545";
                
                // --- ส่วนที่ปรับปรุงใหม่ ---
                // ถ้าเป็นรายการที่ 0 (ล่าสุด) ให้ใส่ class "active" เพื่อให้กางออกทันที
                let isActive = (index === 0) ? "active" : ""; 
                
                html += `
                <div class="history-item ${isActive}" id="item-${index}">
                    <div class="history-header" onclick="toggleHistory(${index})">
                        <span>📅 ${h.date}</span>
                        <span style="color:${statusColor}; font-size:12px;">${h.status}</span>
                    </div>
                    <div class="history-body">
                        <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                            <span>✅ <b>เข้า:</b></span> <span>${h.timeIn}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between;">
                            <span>❌ <b>ออก:</b></span> <span>${h.timeOut || '-'}</span>
                        </div>
                        <div style="text-align:right; margin-top:5px; font-size:10px; color:blue;">
                            (บันทึกสำเร็จแล้ว)
                        </div>
                    </div>
                </div>`;
            });
            listDiv.innerHTML = html;
        } catch(e) { 
            listDiv.innerHTML = '<p style="color:red; text-align:center; font-size:12px;">โหลดประวัติไม่สำเร็จ</p>'; 
        }
    }

    function toggleHistory(index) {
        document.getElementById(`item-${index}`).classList.toggle('active');
    }

    async function register() {
        const name = document.getElementById('regName').value;
        if(!name) return alert("ใส่ชื่อด้วยครับ");
        showLoader("บันทึก...", 50);
        try {
            await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'register', userId: userProfile.userId, name: name })
            });
            alert("ลงทะเบียนสำเร็จ");
            location.reload();
        } catch(e) { alert("ผิดพลาด"); hideLoader(); }
    }

    initLiff();
</script>
</body>
</html>
