<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; background: #f4f7f6; display: flex; justify-content: center; color: #333; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; overflow-x: hidden; }
        .header { background: #00B900; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .header h2 { margin: 0; font-weight: 500; font-size: 22px; }
        .content { padding: 20px; text-align: center; }
        .time-box { margin-bottom: 20px; }
        .clock { font-size: 40px; font-weight: 700; color: #00B900; line-height: 1; margin-bottom: 5px; }
        .date { font-size: 16px; color: #666; }
        .video-container { width: 100%; height: 300px; background: #000; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: 500; color: white; font-family: 'Sarabun', sans-serif; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-in { background: #28a745; }
        .btn-out { background: #dc3545; }
        .btn-history { background: #6c757d; width: 100%; padding: 12px; margin-top: 10px; }
        .btn-reg { background: #007bff; width: 100%; margin-top: 20px; }
        input[type="text"] { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; box-sizing: border-box; text-align: center; }
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .progress-box { width: 80%; max-width: 300px; background: #e9ecef; border-radius: 10px; overflow: hidden; margin-top: 20px; height: 15px; }
        .progress-bar { width: 0%; height: 100%; background: #00B900; transition: width 0.4s ease; }
        .loader-text { margin-top: 15px; font-size: 18px; font-weight: 500; color: #333; }
        .history-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 500; display: none; overflow-y: auto; padding-bottom: 30px; }
        .history-item { background: #f8f9fa; margin: 10px 20px; padding: 15px; border-radius: 10px; border-left: 5px solid #00B900; text-align: left; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
<canvas id="canvas" style="display:none;"></canvas>
<div class="app-container">
    <div class="loader-overlay" id="loader">
        <div class="spinner" style="font-size:50px;">⏳</div>
        <div class="loader-text" id="loader-text">กำลังเตรียมพร้อม...</div>
        <div class="progress-box"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div id="reg-form" class="content hidden">
        <h2 style="color: #007bff;">ลงทะเบียนใช้งานครั้งแรก</h2>
        <p>กรุณาระบุชื่อ-นามสกุล ของคุณ</p>
        <input type="text" id="regName" placeholder="ระบุ ชื่อ-นามสกุล">
        <button class="btn btn-reg" onclick="register()">ลงทะเบียน</button>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <h2>ระบบบันทึกเวลาทำงาน</h2>
            <div id="welcomeMsg" style="font-size: 14px; margin-top: 5px; opacity: 0.9;">สวัสดีคุณ...</div>
        </div>
        <div class="content">
            <div class="time-box">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="date">วัน เดือน ปี</div>
            </div>
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>
            <div class="btn-group">
                <button class="btn btn-in" onclick="processAttendance('in')">สแกนเข้างาน</button>
                <button class="btn btn-out" onclick="processAttendance('out')">สแกนออกงาน</button>
            </div>
            <button class="btn btn-history" onclick="fetchHistory()">ดูประวัติการลงเวลา</button>
        </div>
    </div>

    <div class="history-modal" id="history-modal">
        <div class="header" style="background: #6c757d; border-radius: 0;">
            <h2>ประวัติย้อนหลัง 10 รายการ</h2>
        </div>
        <div id="history-list"></div>
        <div style="text-align: center;">
            <button class="btn" style="background:#dc3545; margin-top:20px;" onclick="document.getElementById('history-modal').style.display='none'">ปิดหน้าต่าง</button>
        </div>
    </div>
</div>

<script>
    // ⚙️ ตั้งค่า (ใช้ URL เดิมที่คุณให้มา)
    const API_URL = "https://script.google.com/macros/s/AKfycbzmWupyTuisestNMQXYY19GrwdDn_GOvuWiCP5-YQiozQIyVksARdf1Zj4U8ofM7EIv0Q/exec"; 
    const LIFF_ID = "2009502922-k1zdFCRh"; 
    const OFFICE_LAT = 16.8071155; 
    const OFFICE_LNG = 100.2636339; 
    const ALLOWED_RADIUS = 1000; 

    let userProfile = {};
    let registeredName = "";

    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        document.getElementById('date').innerText = now.toLocaleDateString('th-TH', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    setInterval(updateClock, 1000);

    async function initLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                userProfile = await liff.getProfile();
                checkRegistration();
            }
        } catch (e) { console.error("LIFF Error", e); }
    }

    async function checkRegistration() {
        showLoader("กำลังตรวจสอบข้อมูล...", 50);
        try {
            // แก้ไขจุดที่ 1: เปลี่ยนวิธีรับข้อมูลจาก .text() เป็น .json() ให้ตรงกับสคริปต์
            const resp = await fetch(`${API_URL}?userId=${userProfile.userId}`, { method: 'GET', redirect: 'follow' });
            const result = await resp.json();
            
            hideLoader();
            if (result.isRegistered) {
                registeredName = result.name;
                document.getElementById('welcomeMsg').innerText = "พนักงาน: " + registeredName;
                document.getElementById('main-app').classList.remove('hidden');
                startVideo();
            } else {
                document.getElementById('reg-form').classList.remove('hidden');
            }
        } catch(e) {
            console.error(e);
            hideLoader();
            document.getElementById('reg-form').classList.remove('hidden'); // กรณี Error ให้ลองไปหน้าลงทะเบียน
        }
    }

    function startVideo() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { document.getElementById('video').srcObject = stream; })
            .catch(err => alert("กรุณาอนุญาตการเข้าถึงกล้อง"));
    }

    function showLoader(text, percent, icon="⏳") {
        document.getElementById('loader').style.display = 'flex';
        document.getElementById('loader-text').innerText = text;
        document.getElementById('progress-bar').style.width = percent + '%';
    }
    function hideLoader() { document.getElementById('loader').style.display = 'none'; }

    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    async function processAttendance(type) {
        showLoader("กำลังตรวจสอบพิกัด...", 20, "📍");
        navigator.geolocation.getCurrentPosition(async (pos) => {
            
            }

            showLoader("กำลังถ่ายภาพ...", 50, "📸");
            const canvas = document.getElementById('canvas');
            const video = document.getElementById('video');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const img = canvas.toDataURL('image/jpeg', 0.5);

            showLoader("กำลังบันทึก...", 80, "☁️");
            try {
                // แก้ไขจุดที่ 2: ส่งเป็น JSON String ให้ตรงกับ doPost
                const response = await fetch(API_URL, {
                    method: 'POST',
                    redirect: 'follow',
                    body: JSON.stringify({ action: 'attendance', name: registeredName, type: type, location: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`, image: img })
                });
                const resText = await response.text();
                if(resText.includes("Success")) {
                    alert("บันทึกสำเร็จ!");
                    location.reload();
                }
            } catch (e) { alert("เกิดข้อผิดพลาด"); hideLoader(); }
        }, () => { alert("กรุณาเปิด GPS"); hideLoader(); }, { enableHighAccuracy: true });
    }

    async function register() {
        const name = document.getElementById('regName').value;
        if(!name) return alert("ระบุชื่อด้วยครับ");
        showLoader("บันทึกข้อมูล...", 50);
        try {
            await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'register', userId: userProfile.userId, name: name })
            });
            alert("ลงทะเบียนสำเร็จ");
            location.reload();
        } catch(e) { alert("ล้มเหลว"); hideLoader(); }
    }

    async function fetchHistory() {
        showLoader("ดึงประวัติ...", 50);
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'history', name: registeredName })
            });
            const data = await resp.json();
            let html = '';
            data.forEach(h => {
                html += `<div class="history-item">📅 ${h.date}<br>✅ เข้า: ${h.timeIn} | ❌ ออก: ${h.timeOut}</div>`;
            });
            document.getElementById('history-list').innerHTML = html || '<p>ไม่พบข้อมูล</p>';
            document.getElementById('history-modal').style.display = 'block';
            hideLoader();
        } catch(e) { alert("ดึงข้อมูลไม่สำเร็จ"); hideLoader(); }
    }

    initLiff();
</script>
</body>
</html>
