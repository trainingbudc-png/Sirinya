<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIFF Face Scan</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #fafafa; }
        #video { width: 100%; max-width: 400px; border-radius: 15px; background: #000; }
        .hidden { display: none; }
        .btn { padding: 15px 30px; border: none; border-radius: 10px; color: white; font-size: 18px; margin: 10px; width: 80%; }
        .btn-reg { background: #007bff; }
        .btn-in { background: #28a745; }
        .btn-out { background: #dc3545; }
    </style>
</head>
<body>
    <div id="loading">กำลังโหลด...</div>

    <div id="reg-form" class="hidden">
        <h3>ลงทะเบียนครั้งแรก</h3>
        <p>คุณยังไม่ได้ลงทะเบียนในระบบ</p>
        <input type="text" id="regName" placeholder="ชื่อ-นามสกุล" style="padding:10px; width:80%; margin-bottom:10px;"><br>
        <button class="btn btn-reg" onclick="register()">บันทึกข้อมูล</button>
    </div>

    <div id="main-app" class="hidden">
        <h3 id="welcomeMsg">สวัสดีคุณ...</h3>
        <video id="video" autoplay muted playsinline></video>
        <div>
            <button class="btn btn-in" onclick="sendData('in')">สแกนเข้างาน</button>
            <button class="btn btn-out" onclick="sendData('out')">สแกนออกงาน</button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxwqePOwLUuxPxP3EYsWDrZ2WjQbyBbvGCl5TJJugTESI06-Mh_3bxpr-wasSV6r6YkPg/exec";
        let userProfile = {};
        let registeredName = "";

        async function initLiff() {
            await liff.init({ liffId: "2009502922-k1zdFCRh" });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                userProfile = await liff.getProfile();
                checkRegistration();
            }
        }

        async function checkRegistration() {
            const resp = await fetch(`${API_URL}?userId=${userProfile.userId}`);
            const result = await resp.text();
            
            document.getElementById('loading').classList.add('hidden');
            if (result === "not_found") {
                document.getElementById('reg-form').classList.remove('hidden');
            } else {
                registeredName = result;
                showMainApp();
            }
        }

        function showMainApp() {
            document.getElementById('welcomeMsg').innerText = "สวัสดีคุณ " + registeredName;
            document.getElementById('reg-form').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            startVideo();
        }

        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
                .then(stream => { document.getElementById('video').srcObject = stream; });
        }

        async function register() {
            const name = document.getElementById('regName').value;
            if(!name) return alert("กรุณากรอกชื่อ");
            
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'register', userId: userProfile.userId, name: name })
            });
            alert("ลงทะเบียนสำเร็จ!");
            location.reload();
        }

        async function sendData(type) {
            // ในที่นี้คือการกดปุ่มยืนยันพร้อมใบหน้าหน้ากล้อง
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'attendance', name: registeredName, type: type })
            });
            alert(`บันทึกเวลา ${type === 'in' ? 'เข้า' : 'ออก'} สำเร็จ`);
            liff.closeWindow();
        }

        initLiff();
    </script>
</body>
</html>
