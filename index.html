<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบลงเวลาทำงาน</title>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; margin: 0; padding: 0; background: #f4f7f6; display: flex; justify-content: center; color: #333; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: #fff; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; overflow-x: hidden; padding-bottom: 20px;}
        .header { background: #00B900; color: white; padding: 20px; text-align: center; border-radius: 0 0 20px 20px; }
        .header h2 { margin: 0; font-weight: 500; font-size: 22px; }
        .content { padding: 20px; text-align: center; }
        
        .time-box { margin-bottom: 20px; }
        .clock { font-size: 40px; font-weight: 700; color: #00B900; line-height: 1; margin-bottom: 5px; }
        .date { font-size: 16px; color: #666; }

        .video-container { width: 100%; height: 250px; background: #000; border-radius: 15px; overflow: hidden; position: relative; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        .btn-group { display: flex; gap: 10px; margin-bottom: 25px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 10px; font-size: 18px; font-weight: 500; color: white; font-family: 'Sarabun', sans-serif; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn:active { transform: scale(0.95); }
        .btn-in { background: #28a745; }
        .btn-out { background: #dc3545; }
        
        /* สไตล์ใหม่สำหรับพื้นที่โชว์ประวัติหน้าหลัก */
        .history-section { text-align: left; padding: 0 20px; margin-top: 20px; border-top: 2px solid #eee; padding-top: 20px; }
        .history-section h3 { margin-top: 0; color: #555; font-weight: 500; }
        .history-list-main { max-height: 300px; overflow-y: auto; } /* กำหนดความสูงและให้เลื่อนดูได้ */
        
        .history-item { background: #f8f9fa; margin-bottom: 10px; padding: 15px; border-radius: 10px; border-left: 5px solid #00B900; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .history-item-date { font-weight: 700; color: #333; margin-bottom: 5px; }
        .history-item-time { display: flex; justify-content: space-between; font-size: 15px; }
        .time-in { color: #28a745; font-weight: 500; }
        .time-out { color: #dc3545; font-weight: 500; }

        /* Loader styling */
        .loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .progress-box { width: 80%; max-width: 300px; background: #e9ecef; border-radius: 10px; overflow: hidden; margin-top: 20px; height: 15px; }
        .progress-bar { width: 0%; height: 100%; background: #00B900; transition: width 0.4s ease; }
        .loader-text { margin-top: 15px; font-size: 18px; font-weight: 500; color: #333; }
        .spinner { font-size: 50px; animation: bounce 1s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }

        .hidden { display: none !important; }
        
        /* สไตล์สำหรับฟอร์มลงทะเบียน */
        #reg-form input[type="text"] { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 10px; font-family: 'Sarabun', sans-serif; font-size: 16px; box-sizing: border-box; text-align: center; margin-bottom: 20px;}
        .btn-reg { background: #007bff; width: 100%; }

    </style>
</head>
<body>
<canvas id="canvas" style="display:none;"></canvas>

<div class="app-container">
    
    <div class="loader-overlay" id="loader">
        <div class="spinner">⏳</div>
        <div class="loader-text" id="loader-text">กำลังเตรียมพร้อม...</div>
        <div class="progress-box"><div class="progress-bar" id="progress-bar"></div></div>
    </div>

    <div id="reg-form" class="content hidden">
        <h2 style="color: #007bff;">ลงทะเบียนใช้งานครั้งแรก</h2>
        <p style="color: #666;">กรุณาระบุชื่อ-นามสกุล ของคุณเพื่อผูกกับระบบ</p>
        <input type="text" id="regName" placeholder="ระบุ ชื่อ-นามสกุล">
        <button class="btn btn-reg" onclick="register()">ลงทะเบียน</button>
    </div>

    <div id="main-app" class="hidden">
        <div class="header">
            <h2>ระบบบันทึกเวลาทำงาน</h2>
            <div id="welcomeMsg" style="font-size: 14px; margin-top: 5px; opacity: 0.9;">สวัสดีคุณ...</div>
        </div>
        
        <div class="content">
            <div class="time-box">
                <div class="clock" id="clock">00:00:00</div>
                <div class="date" id="date">วัน เดือน ปี</div>
            </div>

            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
            </div>

            <div class="btn-group">
                <button class="btn btn-in" onclick="processAttendance('in')">สแกนเข้างาน</button>
                <button class="btn btn-out" onclick="processAttendance('out')">สแกนออกงาน</button>
            </div>
            
            </div>

        <div class="history-section">
            <h3>ประวัติการลงเวลาล่าสุด</h3>
            <div id="history-list-main" class="history-list-main">
                <p style="text-align:center; color:#999;">กำลังโหลดประวัติ...</p>
            </div>
        </div>
    </div>

</div>

<script>
    // ========================================================
    // ⚙️ ตั้งค่าระบบ (ดึงมาจากโค้ดเดิมของคุณ)
    // ========================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbyLmuQd8Ok0wVCrmmCYV93JlnOyC8jdMKzV9yejAWYZN65Rgn-8qhYAcne-ILN6jogPSw/exec"; 
    const LIFF_ID = "2009502922-k1zdFCRh"; 

    // 📍 ตั้งค่าพิกัดสถานที่ทำงาน (ดึงมาจากโค้ดเดิมของคุณ)
    const OFFICE_LAT = 16.808436;  
    const OFFICE_LNG = 100.263549; 
    const ALLOWED_RADIUS = 200;  // รัศมีที่อนุญาตให้สแกนได้ (เมตร)
    // ========================================================

    let userProfile = {};
    let registeredName = "";

    // ฟังก์ชันอัปเดตนาฬิกา
    function updateClock() {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH', { hour12: false });
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('date').innerText = now.toLocaleDateString('th-TH', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // เริ่มต้น LIFF
    async function initLiff() {
        try {
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                liff.login();
            } else {
                userProfile = await liff.getProfile();
                checkRegistration();
            }
        } catch (e) {
            console.error("LIFF Init Error", e);
            alert("ไม่สามารถเริ่มต้นระบบ LIFF ได้");
        }
    }

    // ตรวจสอบการลงทะเบียน
    async function checkRegistration() {
        showLoader("กำลังตรวจสอบข้อมูล...", 30);
        try {
            const resp = await fetch(`${API_URL}?userId=${userProfile.userId}`, {
                method: 'GET',
                redirect: 'follow'
            });
            const result = await resp.json();
            
            hideLoader();
            if (result.isRegistered) {
                registeredName = result.name;
                document.getElementById('welcomeMsg').innerText = "พนักงาน: " + registeredName;
                document.getElementById('main-app').classList.remove('hidden');
                startVideo();
                fetchHistory(); // ดึงประวัติมาโชว์ทันทีเมื่อเข้าหน้าหลัก
            } else {
                document.getElementById('reg-form').classList.remove('hidden');
            }
        } catch(e) {
            console.error("Check Reg Error", e);
            alert("เชื่อมต่อฐานข้อมูลล้มเหลว กรุณาลองใหม่");
            hideLoader();
        }
    }

    // เปิดกล้อง
    function startVideo() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
            .then(stream => { document.getElementById('video').srcObject = stream; })
            .catch(err => {
                console.error("Camera Error", err);
                alert("กรุณาอนุญาตการเข้าถึงกล้องถ่ายรูปเพื่อสแกนใบหน้า");
            });
    }

    // ฟังก์ชันแสดง Loader
    function showLoader(text, percent, icon="⏳") {
        document.getElementById('loader').style.display = 'flex';
        document.querySelector('.spinner').innerText = icon;
        document.getElementById('loader-text').innerText = text;
        document.getElementById('progress-bar').style.width = percent + '%';
    }
    // ฟังก์ชันซ่อน Loader
    function hideLoader() {
        document.getElementById('loader').style.display = 'none';
    }
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    // สูตรคำนวณระยะทางจากพิกัด (Haversine formula)
    function calculateDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // รัศมีโลก (เมตร)
        const rad1 = lat1 * Math.PI / 180;
        const rad2 = lat2 * Math.PI / 180;
        const deltaLat = (lat2 - lat1) * Math.PI / 180;
        const deltaLon = (lon2 - lon1) * Math.PI / 180;

        const a = Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
                  Math.cos(rad1) * Math.cos(rad2) *
                  Math.sin(deltaLon / 2) * Math.sin(deltaLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; 
    }

    // ฟังก์ชันดึงพิกัด GPS
    function getCurrentLocation() {
        return new Promise((resolve, reject) => {
            if (!navigator.geolocation) {
                reject(new Error("มือถือของคุณไม่รองรับระบบ GPS"));
            } else {
                navigator.geolocation.getCurrentPosition(
                    (position) => resolve(position),
                    (error) => reject(new Error("กรุณาเปิด GPS และอนุญาตให้เข้าถึงตำแหน่งที่ตั้ง")),
                    { enableHighAccuracy: true, timeout: 10000 }
                );
            }
        });
    }

    // สแกนใบหน้า ถ่ายรูป และบันทึกเวลา
    async function processAttendance(type) {
        let typeText = type === 'in' ? 'เข้างาน' : 'ออกงาน';
        document.getElementById('progress-bar').style.background = "#00B900"; 
        
        showLoader("กำลังตรวจสอบพิกัด...", 20, "📍");

        try {
            // 1. ตรวจสอบ GPS
            const position = await getCurrentLocation();
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;

            // 2. คำนวณระยะห่าง
            const distance = calculateDistance(lat, lng, OFFICE_LAT, OFFICE_LNG);
            if (distance > ALLOWED_RADIUS) {
                showLoader(`คุณอยู่นอกพื้นที่! (ห่าง ${Math.round(distance)} เมตร)`, 100, "🛑");
                document.getElementById('progress-bar').style.background = "red";
                await sleep(3500); hideLoader();
                return; 
            }

            // 3. ถ่ายภาพ
            showLoader("กำลังถ่ายภาพ...", 50, "📸");
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageDataUrl = canvas.toDataURL('image/jpeg', 0.6); // บีบอัดรูป

            // 4. ส่งข้อมูลบันทึก
            showLoader("กำลังบันทึกข้อมูล...", 80, "☁️");
            const response = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow', // สำคัญสำหรับ Apps Script
                body: JSON.stringify({ 
                    action: 'attendance', 
                    name: registeredName, 
                    type: type,
                    location: mapLink,    
                    image: imageDataUrl       
                })
            });

            const resultText = await response.text(); 

            if (resultText === "Success") {
                showLoader(`บันทึกเวลา${typeText} สำเร็จ!`, 100, "✅");
                await sleep(2000); 
                hideLoader();
                fetchHistory(); // ดึงประวัติมาอัปเดตหน้าจอหลักทันทีหลังจากบันทึกสำเร็จ
            } else {
                throw new Error(resultText); 
            }

        } catch (err) {
            console.error("Attendance Error", err);
            showLoader("ข้อผิดพลาด: " + err.message, 100, "❌");
            document.getElementById('progress-bar').style.background = "red";
            await sleep(4000); 
            hideLoader();
        }
    }

    // ฟังก์ชันลงทะเบียน
    async function register() {
        const name = document.getElementById('regName').value;
        if(!name) return alert("กรุณากรอกชื่อ-นามสกุล");
        
        showLoader("กำลังบันทึกข้อมูล...", 50, "📝");
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'register', userId: userProfile.userId, name: name })
            });
            const result = await resp.text();
            if(result === "Registered") {
                showLoader("ลงทะเบียนสำเร็จ!", 100, "🎉");
                await sleep(1500);
                location.reload(); // โหลดหน้าใหม่เพื่อเข้าหน้าหลัก
            } else {
                throw new Error(result);
            }
        } catch (err) {
            console.error("Register Error", err);
            alert("ลงทะเบียนไม่สำเร็จ กรุณาลองใหม่");
            hideLoader();
        }
    }

    // ฟังก์ชันดึงประวัติการลงเวลาและแสดงบนหน้าหลัก (ปรับปรุงใหม่)
    async function fetchHistory() {
        // ไม่แสดง Loader แบบ Overlay เพื่อไม่ให้กวนหน้าหลัก แต่แสดงข้อความกำลังโหลดในพื้นที่ประวัติ
        const listDiv = document.getElementById('history-list-main');
        listDiv.innerHTML = '<p style="text-align:center; color:#999; margin-top:10px;">กำลังอัปเดตประวัติ...</p>';

        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                redirect: 'follow',
                body: JSON.stringify({ action: 'history', name: registeredName })
            });
            const data = await resp.json();
            
            listDiv.innerHTML = ''; // ล้างข้อความกำลังโหลด
            
            if(data.length === 0) {
                listDiv.innerHTML = '<p style="text-align:center; margin-top:20px; color:#999;">ไม่มีประวัติการลงเวลา</p>';
            } else {
                // แสดงประวัติหลายรายการ (สูงสุด 10 ตามที่ Apps Script ส่งมา)
                data.forEach(item => {
                    // กำหนดสีตามสถานะ
                    let statusColor = item.status === "เข้างาน" ? "#28a745" : "#dc3545";
                    let borderStyle = `border-left: 5px solid 0{statusColor}`;

                    listDiv.innerHTML += `
                        <div class="history-item" style="0{borderStyle}">
                            <div class="history-item-date">📅 0{item.date}</div>
                            <div class="history-item-time">
                                <span class="time-in">✅ เข้า: 0{item.timeIn}</span>
                                <span class="time-out">❌ ออก: 0{item.timeOut}</span>
                            </div>
                            <div style="font-size:12px; color:#666; margin-top:5px; text-align:right;">สถานะปัจจุบัน: 0{item.status}</div>
                        </div>
                    `;
                });
            }
        } catch(e) {
            console.error("Fetch History Error", e);
            listDiv.innerHTML = '<p style="text-align:center; color:red; margin-top:10px;">ไม่สามารถดึงข้อมูลประวัติได้</p>';
        }
    }

    // เริ่มทำงานเมื่อโหลดหน้า
    initLiff();

</script>
</body>
</html>
