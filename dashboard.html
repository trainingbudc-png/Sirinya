<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard สรุปเวลาเข้า-ออกงาน</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #00B900; margin-bottom: 20px; }
        
        .filter-box { display: flex; flex-wrap: wrap; gap: 15px; background: #e9ecef; padding: 15px; border-radius: 10px; margin-bottom: 20px; align-items: center; }
        .filter-item { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        label { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
        input[type="date"], select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Sarabun', sans-serif; width: 100%; box-sizing: border-box; }
        button.btn-search { background: #00B900; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; height: 42px; margin-top: auto; }
        button.btn-search:hover { background: #009900; }
        button.btn-clear { background: #6c757d; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; height: 42px; margin-top: auto; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        
        /* --- เพิ่ม Sticky Header ตรงนี้ --- */
        th { 
            background: #00B900; 
            color: white; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.15); /* เพิ่มเงาให้หัวตารางลอยขึ้นมา */
        }
        
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        /* แก้ไขสี */
        .late { color: red; } 
        .overtime { color: #00B900; } 
        .early { color: #ff8c00; } 
        
        /* บังคับตัวหนาเฉพาะหมายเหตุ */
        .remark-bold { font-weight: bold; }
        
        .btn-view { background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: 'Sarabun', sans-serif; }
        .btn-view:hover { background: #138496; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content img { max-width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px; }
        .btn-close { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-family: 'Sarabun', sans-serif;}
        .map-link { display: inline-block; background: #007bff; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; margin-right: 10px; }
        .no-image-text { color: #888; font-style: italic; margin-bottom: 15px; display: none; }

        .loader { text-align: center; padding: 20px; font-size: 18px; color: #666; display: none; }

        /* --- CSS สำหรับตารางย่อ/ขยาย --- */
        .date-cell { position: relative; }
        .badge-count {
            position: absolute; top: 3px; left: 3px;
            background-color: #007bff; color: white;
            font-size: 11px; font-weight: bold;
            padding: 2px 6px; border-radius: 10px; line-height: 1;
        }
        .summary-row { cursor: pointer; background-color: #fcfcfc; transition: 0.2s; }
        .summary-row:hover { background-color: #e2e6ea !important; }
        .detail-row { display: none; background-color: #f8f9fa !important; font-size: 14px; }
        .detail-row td { border-top: 1px dashed #ccc; color: #555; }
        .toggle-icon { margin-left: 5px; font-size: 12px; color: #888; font-weight: normal; }
        
        .toggle-text-link {
            color: #007bff; font-size: 14px; font-weight: bold; 
            text-decoration: underline; cursor: pointer;
        }
        .toggle-text-link:hover { color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Dashboard สรุปเวลาเข้า-ออกงาน</h2>

    <div class="filter-box">
        <div class="filter-item">
            <label>ตั้งแต่วันที่:</label>
            <input type="date" id="startDate">
        </div>
        <div class="filter-item">
            <label>ถึงวันที่:</label>
            <input type="date" id="endDate">
        </div>
        <div class="filter-item">
            <label>เลือกพนักงาน:</label>
            <select id="nameFilter">
                <option value="">-- ดูทุกคน --</option>
            </select>
        </div>
        <button class="btn-search" onclick="applyFilters()">🔍 ค้นหา</button>
        <button class="btn-clear" onclick="clearFilters()">🔄 ล้างค่า</button>
    </div>

    <div id="loader" class="loader">⏳ กำลังโหลดข้อมูล...</div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>วันที่</th>
                <th>วัน</th>
                <th>ชื่อ-นามสกุล</th>
                <th>เวลาเข้างาน</th>
                <th>สาย</th> 
                <th>เวลาออกงาน</th>
                <th>อยู่ต่อ/ออกก่อน</th>
                <th>หมายเหตุ</th>
                <th>ดูข้อมูล</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>
</div>

<div class="modal" id="infoModal">
    <div class="modal-content">
        <h3 style="margin-top:0;">ข้อมูลสแกน</h3>
        <img id="modalImg" src="" alt="รูปภาพสแกน" style="display:none;">
        <p id="noImageText" class="no-image-text">❌ ไม่มีการแนบรูปภาพ</p>
        
        <div>
            <a id="modalMap" href="#" target="_blank" class="map-link">📍 ดูแผนที่ (GPS)</a>
            <button class="btn-close" onclick="closeModal()">ปิดหน้าต่าง</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ ลิงก์ API ของคุณ
    const API_URL = "https://script.google.com/macros/s/AKfycbzmWupyTuisestNMQXYY19GrwdDn_GOvuWiCP5-YQiozQIyVksARdf1Zj4U8ofM7EIv0Q/exec";
    
    let allLogs = [];
    const dayNames = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

    window.onload = async function() {
        document.getElementById('loader').style.display = 'block';
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'getAllData' })
            });
            const data = await response.json();
            
            if (Array.isArray(data)) {
                allLogs = data; 
                populateNameDropdown([]); 
            } else {
                allLogs = data.logs || []; 
                const empList = data.employees || []; 
                populateNameDropdown(empList);
            }
            
            renderTable(allLogs);

        } catch(e) {
            console.error("Fetch Error:", e);
            alert("❌ เชื่อมต่อไม่สำเร็จ: โปรดตรวจสอบลิงก์ API_URL ว่าถูกต้องหรือไม่");
        } finally {
            document.getElementById('loader').style.display = 'none';
        }
    };

    function populateNameDropdown(empArray) {
        if (!empArray || empArray.length === 0) return; 
        
        const nameSelect = document.getElementById('nameFilter');
        const cleanNames = empArray.map(name => name ? String(name).trim() : "").filter(name => name !== "");
        const uniqueNames = [...new Set(cleanNames)].sort(); 

        nameSelect.innerHTML = '<option value="">-- ดูทุกคน --</option>';
        uniqueNames.forEach(name => {
            let option = document.createElement('option');
            option.value = name;
            option.textContent = name;
            nameSelect.appendChild(option);
        });
    }

    function clearFilters() {
        document.getElementById('startDate').value = '';
        document.getElementById('endDate').value = '';
        document.getElementById('nameFilter').value = '';
        renderTable(allLogs);
    }

    function parseDateTH(dateStr) {
        if (!dateStr || dateStr === "") return null;
        let cleanDate = dateStr.replace(/-/g, '/').split(' ')[0]; 
        let parts = cleanDate.split('/');
        
        if (parts.length === 3) {
            let year = parseInt(parts[2]);
            if (year > 2500) year -= 543; 
            return new Date(year, parseInt(parts[1]) - 1, parseInt(parts[0]));
        }
        return null;
    }

    function applyFilters() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const nameSearch = document.getElementById('nameFilter').value.trim();

        let filteredData = allLogs;

        if (nameSearch !== "") {
            filteredData = filteredData.filter(item => {
                const itemName = item.name ? String(item.name).trim() : "";
                return itemName === nameSearch;
            });
        }

        if (startDate || endDate) {
            filteredData = filteredData.filter(item => {
                const rowDate = parseDateTH(item.rawDate);
                if (!rowDate) return false;
                rowDate.setHours(0,0,0,0);

                let isAfterStart = true;
                let isBeforeEnd = true;

                if (startDate) {
                    const sDate = new Date(startDate);
                    sDate.setHours(0,0,0,0);
                    isAfterStart = rowDate >= sDate;
                }
                if (endDate) {
                    const eDate = new Date(endDate);
                    eDate.setHours(0,0,0,0);
                    isBeforeEnd = rowDate <= eDate;
                }
                return isAfterStart && isBeforeEnd;
            });
        }
        renderTable(filteredData);
    }

    function timeToMinutes(timeStr) {
        if (!timeStr || timeStr === "") return 0;
        let parts = timeStr.split(":");
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }

    function calcTimeLogic(cleanTimeIn, cleanTimeOut) {
        let timeInHtml = cleanTimeIn;
        let remark = "";
        let lateMinutesText = "";
        let overMinutesText = "";

        if (cleanTimeIn !== "") {
            let inMins = timeToMinutes(cleanTimeIn);
            let baseInMins = (8 * 60) + 30; // 08:30
            if (inMins > baseInMins) {
                let diffLate = inMins - baseInMins;
                let lateHours = Math.floor(diffLate / 60);
                let lateMins = diffLate % 60;
                let lateText = "";
                if (lateHours > 0) lateText += lateHours + " ชม. ";
                if (lateMins > 0 || lateHours === 0) lateText += lateMins + " นาที";
                
                timeInHtml = `<span class="late">${cleanTimeIn}</span>`;
                lateMinutesText = `<span class="late">${lateText.trim()}</span>`;
                remark = `<span class="late remark-bold">สาย</span>`;
            } else {
                timeInHtml = `<span>${cleanTimeIn}</span>`;
            }
        }

        if (cleanTimeOut !== "") {
            let outMins = timeToMinutes(cleanTimeOut);
            let baseOutMins = (16 * 60) + 30; // 16:30
            if (outMins > baseOutMins) {
                let diffOver = outMins - baseOutMins;
                let overHours = Math.floor(diffOver / 60);
                let overMins = diffOver % 60;
                let overText = "";
                if (overHours > 0) overText += overHours + " ชม. ";
                if (overMins > 0 || overHours === 0) overText += overMins + " นาที";
                overMinutesText = `<span class="overtime">+${overText.trim()}</span>`; 
            } else if (outMins < baseOutMins) {
                let diffEarly = baseOutMins - outMins;
                let earlyHours = Math.floor(diffEarly / 60);
                let earlyMins = diffEarly % 60;
                let earlyText = "";
                if (earlyHours > 0) earlyText += earlyHours + " ชม. ";
                if (earlyMins > 0 || earlyHours === 0) earlyText += earlyMins + " นาที";
                overMinutesText = `<span class="early">-${earlyText.trim()}</span>`;
                let earlyRemark = `<span class="early remark-bold">ออกก่อนเวลา</span>`;
                remark = remark !== "" ? `${remark}, ${earlyRemark}` : earlyRemark;
            }
        }
        return { timeInHtml, lateMinutesText, overMinutesText, remark };
    }

    function createBtnHtml(item) {
        if (!item.image && (!item.location || item.location === "ไม่ระบุ" || item.location === "")) {
            return `<span style="color:#aaa;">ไม่มีข้อมูล</span>`;
        }
        return `<button class="btn-view" onclick="openModal('${item.image}', '${item.location}')">ดูข้อมูล</button>`;
    }

    function renderTable(dataArray) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if(!dataArray || dataArray.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" style="padding: 20px; color: #666;">ไม่มีข้อมูลในช่วงที่เลือก</td></tr>';
            return;
        }

        // 1. จัดกลุ่มข้อมูล
        const groups = {};
        dataArray.forEach(item => {
            let cleanDate = (!item.date || item.date === "-") ? "" : item.date;
            let cleanName = (!item.name || item.name === "-") ? "" : item.name;
            let key = cleanDate + "||" + cleanName;
            if (!groups[key]) groups[key] = [];
            groups[key].push(item);
        });

        let groupId = 0;

        // 2. วาดตาราง
        for (const key in groups) {
            groupId++; 
            let currentGroupId = groupId; 

            const groupItems = groups[key];
            const count = groupItems.length;
            const firstItem = groupItems[0]; 
            
            let dayName = "";
            const d = parseDateTH(firstItem.rawDate);
            if(d) { dayName = dayNames[d.getDay()]; }
            
            let cleanDate = (!firstItem.date || firstItem.date === "-") ? "" : firstItem.date;
            let cleanName = (!firstItem.name || firstItem.name === "-") ? "" : firstItem.name;

            let firstTimeIn = "";
            let lastTimeOut = "";
            groupItems.forEach(item => {
                let tIn = (!item.timeIn || item.timeIn === "-") ? "" : item.timeIn;
                let tOut = (!item.timeOut || item.timeOut === "-") ? "" : item.timeOut;
                
                if (tIn !== "") {
                    if (firstTimeIn === "" || tIn < firstTimeIn) firstTimeIn = tIn;
                }
                if (tOut !== "") {
                    if (lastTimeOut === "" || tOut > lastTimeOut) lastTimeOut = tOut;
                }
            });

            let sumResult = calcTimeLogic(firstTimeIn, lastTimeOut);

            let summaryTr = document.createElement('tr');
            
            let badgeHtml = count > 1 ? `<span class="badge-count">${count}</span>` : '';
            let toggleIconHtml = count > 1 ? `<span id="icon-group-${currentGroupId}" class="toggle-icon">▼</span>` : '';
            let btnSummaryHtml = count > 1 ? `<span class="toggle-text-link">กดดูรายละเอียด</span>` : createBtnHtml(firstItem);

            summaryTr.innerHTML = `
                <td class="date-cell">${badgeHtml} ${cleanDate}</td>
                <td>${dayName}</td>
                <td style="text-align: left;">${cleanName} ${toggleIconHtml}</td>
                <td>${sumResult.timeInHtml}</td>
                <td>${sumResult.lateMinutesText}</td>
                <td>${lastTimeOut}</td>
                <td>${sumResult.overMinutesText}</td>
                <td>${sumResult.remark}</td>
                <td>${btnSummaryHtml}</td>
            `;

            if (count > 1) {
                summaryTr.className = 'summary-row';
                summaryTr.addEventListener('click', function() {
                    const rows = document.querySelectorAll('.detail-group-' + currentGroupId);
                    const icon = document.getElementById('icon-group-' + currentGroupId);
                    
                    if (rows.length === 0) return;
                    
                    const isHidden = (rows[0].style.display === 'none' || rows[0].style.display === '');
                    
                    rows.forEach(row => {
                        row.style.display = isHidden ? 'table-row' : 'none';
                    });
                    
                    if (icon) {
                        icon.innerHTML = isHidden ? '▲' : '▼';
                    }
                });
            }

            tbody.appendChild(summaryTr);

            if (count > 1) {
                groupItems.forEach((item, index) => {
                    let detTimeIn = (!item.timeIn || item.timeIn === "-") ? "" : item.timeIn;
                    let detTimeOut = (!item.timeOut || item.timeOut === "-") ? "" : item.timeOut;
                    let detResult = calcTimeLogic(detTimeIn, detTimeOut);

                    let detailTr = document.createElement('tr');
                    detailTr.className = `detail-row detail-group-${currentGroupId}`;
                    
                    detailTr.innerHTML = `
                        <td style="text-align: right; color:#888; font-size:13px;">↳ ครั้งที่ ${index + 1}</td>
                        <td style="color:#888;">${dayName}</td>
                        <td style="text-align: left; color:#888;">${cleanName}</td>
                        <td>${detResult.timeInHtml}</td>
                        <td>${detResult.lateMinutesText}</td>
                        <td>${detTimeOut}</td>
                        <td>${detResult.overMinutesText}</td>
                        <td>${detResult.remark}</td>
                        <td>${createBtnHtml(item)}</td>
                    `;
                    tbody.appendChild(detailTr);
                });
            }
        }
    }

    function getDirectImageUrl(url) {
        if (!url || url === "undefined") return "";
        let fileId = "";
        
        if (url.includes("/file/d/")) {
            fileId = url.split("/file/d/")[1].split("/")[0];
        } 
        else if (url.includes("id=")) {
            fileId = url.split("id=")[1].split("&")[0];
        }

        if (fileId) {
            return "https://drive.google.com/thumbnail?id=" + fileId + "&sz=w800";
        }
        return url; 
    }

    function openModal(imgUrl, mapUrl) {
        const imgElement = document.getElementById('modalImg');
        const noImageText = document.getElementById('noImageText');
        
        const directImgUrl = getDirectImageUrl(imgUrl);
        
        if (directImgUrl && directImgUrl !== "") {
            imgElement.src = directImgUrl;
            imgElement.style.display = "block";
            if(noImageText) noImageText.style.display = "none"; 
        } else {
            imgElement.src = "";
            imgElement.style.display = "none";
            if(noImageText) noImageText.style.display = "block";
        }

        const mapElement = document.getElementById('modalMap');
        mapElement.href = mapUrl && mapUrl !== "ไม่ระบุ" && mapUrl !== "" ? mapUrl : "#";
        mapElement.style.display = mapUrl && mapUrl !== "ไม่ระบุ" && mapUrl !== "" ? "inline-block" : "none";
        
        document.getElementById('infoModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = "none";
    }

</script>

</body>
</html>
