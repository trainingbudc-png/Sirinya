<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard สรุปการมาสาย</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1200px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #00B900; margin-bottom: 20px; }
        
        /* Filter Section */
        .filter-box { display: flex; flex-wrap: wrap; gap: 15px; background: #e9ecef; padding: 15px; border-radius: 10px; margin-bottom: 20px; align-items: center; }
        .filter-item { display: flex; flex-direction: column; flex: 1; min-width: 200px; }
        label { font-size: 14px; font-weight: 500; margin-bottom: 5px; }
        input[type="date"], select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-family: 'Sarabun', sans-serif; }
        button.btn-search { background: #00B900; color: white; border: none; padding: 10px 20px; border-radius: 5px; font-size: 16px; cursor: pointer; height: 42px; margin-top: auto; }
        button.btn-search:hover { background: #009900; }

        /* Table Section */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; }
        th { background: #00B900; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }
        
        .late { color: red; font-weight: bold; } /* สีแดงสำหรับคนมาสาย */
        .btn-view { background: #17a2b8; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-family: 'Sarabun', sans-serif; }
        .btn-view:hover { background: #138496; }

        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; }
        .modal-content img { max-width: 100%; height: auto; border-radius: 10px; margin-bottom: 15px; }
        .btn-close { background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-top: 10px; font-family: 'Sarabun', sans-serif;}
        .map-link { display: inline-block; background: #007bff; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; margin-right: 10px; }

        .loader { text-align: center; padding: 20px; font-size: 18px; color: #666; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Dashboard สรุปเวลาเข้า-ออกงาน</h2>

    <div class="filter-box">
        <div class="filter-item">
            <label>ตั้งแต่วันที่:</label>
            <input type="date" id="startDate">
        </div>
        <div class="filter-item">
            <label>ถึงวันที่:</label>
            <input type="date" id="endDate">
        </div>
        <div class="filter-item">
            <label>เลือกพนักงาน:</label>
            <select id="nameFilter">
                <option value="all">-- ทุกคน --</option>
            </select>
        </div>
        <button class="btn-search" onclick="applyFilters()">🔍 ค้นหา</button>
    </div>

    <div id="loader" class="loader">⏳ กำลังโหลดข้อมูล...</div>

    <table id="dataTable">
        <thead>
            <tr>
                <th>วันที่</th>
                <th>วัน</th>
                <th>ชื่อ-นามสกุล</th>
                <th>เวลาเข้างาน</th>
                <th>เวลาออกงาน</th>
                <th>หมายเหตุ</th>
                <th>ดูข้อมูล</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<div class="modal" id="infoModal">
    <div class="modal-content">
        <h3 style="margin-top:0;">ข้อมูลสแกนเข้างาน</h3>
        <img id="modalImg" src="" alt="ไม่มีรูปภาพ" onerror="this.src='https://via.placeholder.com/300?text=No+Image';">
        <div>
            <a id="modalMap" href="#" target="_blank" class="map-link">📍 ดูแผนที่ (GPS)</a>
            <button class="btn-close" onclick="closeModal()">ปิดหน้าต่าง</button>
        </div>
    </div>
</div>

<script>
    // ⚠️ นำ API URL ของคุณมาใส่ตรงนี้
    const API_URL = "https://script.google.com/macros/s/AKfycbypD9M43wzu6CIX2t9Mh2GBAlTN6lHdv6Bh5EqQIgL-yaJCAPT1jCw_jTdi29YH3eN47Q/exec";
    
    let allData = [];

    const dayNames = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];

    // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้า
    window.onload = async function() {
        document.getElementById('loader').style.display = 'block';
        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'getAllData' })
            });
            allData = await resp.json();
            
            populateNameFilter();
            renderTable(allData);
        } catch(e) {
            alert("ไม่สามารถดึงข้อมูลได้ กรุณาลองใหม่");
        }
        document.getElementById('loader').style.display = 'none';
    };

    // นำรายชื่อพนักงานทั้งหมดไปใส่ใน Dropdown
    function populateNameFilter() {
        const select = document.getElementById('nameFilter');
        const uniqueNames = [...new Set(allData.map(item => item.name).filter(name => name !== "-"))];
        
        uniqueNames.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.innerText = name;
            select.appendChild(option);
        });
    }

    // ฟังก์ชันกรองข้อมูลตามวันที่และชื่อ
    function applyFilters() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const nameFilter = document.getElementById('nameFilter').value;

        let filteredData = allData;

        // กรองชื่อ
        if (nameFilter !== "all") {
            filteredData = filteredData.filter(item => item.name === nameFilter);
        }

        // กรองวันที่
        if (startDate || endDate) {
            filteredData = filteredData.filter(item => {
                if (!item.rawDate) return false;
                
                // แปลงรูปแบบวันที่จาก Sheet ให้เปรียบเทียบได้
                const rowDate = new Date(item.rawDate);
                rowDate.setHours(0,0,0,0);

                let isAfterStart = true;
                let isBeforeEnd = true;

                if (startDate) {
                    const sDate = new Date(startDate);
                    sDate.setHours(0,0,0,0);
                    isAfterStart = rowDate >= sDate;
                }
                if (endDate) {
                    const eDate = new Date(endDate);
                    eDate.setHours(0,0,0,0);
                    isBeforeEnd = rowDate <= eDate;
                }

                return isAfterStart && isBeforeEnd;
            });
        }

        renderTable(filteredData);
    }

    // ฟังก์ชันแสดงตาราง
    function renderTable(dataArray) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if(dataArray.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7">ไม่มีข้อมูลในช่วงที่เลือก</td></tr>';
            return;
        }

        dataArray.forEach(item => {
            let tr = document.createElement('tr');
            
            // หาชื่อวันในสัปดาห์
            let dayName = "-";
            if(item.rawDate) {
                const d = new Date(item.rawDate);
                dayName = dayNames[d.getDay()];
            }

            // เช็คว่ามาสายหรือไม่ (เกิน 08:30:00)
            let isLate = false;
            let timeInHtml = item.timeIn;
            let remark = "ปกติ";

            if (item.timeIn && item.timeIn !== "-") {
                // เทียบเวลาตรงๆ (String)
                if (item.timeIn > "08:30:00") {
                    isLate = true;
                    timeInHtml = `<span class="late">${item.timeIn}</span>`;
                    remark = `<span class="late">สาย</span>`;
                }
            }

            // ปุ่มดูข้อมูล
            let btnHtml = `<button class="btn-view" onclick="openModal('${item.image}', '${item.location}')">ดูข้อมูล</button>`;
            if (!item.image && !item.location) {
                btnHtml = `<span style="color:#aaa;">ไม่มีข้อมูล</span>`;
            }

            tr.innerHTML = `
                <td>${item.date}</td>
                <td>${dayName}</td>
                <td>${item.name}</td>
                <td>${timeInHtml}</td>
                <td>${item.timeOut}</td>
                <td>${remark}</td>
                <td>${btnHtml}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // เปิด-ปิด Modal หน้าต่างป๊อปอัพ
    function openModal(imgUrl, mapUrl) {
        document.getElementById('modalImg').src = imgUrl ? imgUrl : "https://via.placeholder.com/300?text=No+Image";
        document.getElementById('modalMap').href = mapUrl ? mapUrl : "#";
        document.getElementById('modalMap').style.display = mapUrl ? "inline-block" : "none";
        
        document.getElementById('infoModal').style.display = "flex";
    }

    function closeModal() {
        document.getElementById('infoModal').style.display = "none";
    }
</script>

</body>
</html>
